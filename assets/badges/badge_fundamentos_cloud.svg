<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 375" width="320" height="375">
  <defs>
    <!-- Metallic Brass & Gold Border Gradient -->
    <linearGradient id="goldGrad_badge_fundamentos_cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#dfcbb5" />
      <stop offset="50%" stop-color="#a67c52" />
      <stop offset="75%" stop-color="#edd8c2" />
      <stop offset="100%" stop-color="#8c5e3c" />
    </linearGradient>

    <!-- Pure White Shield Surface with Subtle Bottom Warmth -->
    <radialGradient id="shieldBg_badge_fundamentos_cloud" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#faf6ef" />
    </radialGradient>

    <!-- Warm Coffee Ribbon Gradient -->
    <linearGradient id="ribbonGrad_badge_fundamentos_cloud" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5332" />
      <stop offset="50%" stop-color="#a87850" />
      <stop offset="100%" stop-color="#7c5332" />
    </linearGradient>

    <!-- Soft Ambient Warm Shadow -->
    <filter id="shadow_badge_fundamentos_cloud" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#7a5538" flood-opacity="0.14" />
    </filter>
  </defs>

  <!-- Outer Shield Frame with Metallic Border -->
  <g filter="url(#shadow_badge_fundamentos_cloud)">
    <!-- Outer Gold Trim -->
    <path d="M160,16 C206,16 246,28 272,44 C277,130 266,226 160,326 C54,226 43,130 48,44 C74,28 114,16 160,16 Z"
          fill="url(#goldGrad_badge_fundamentos_cloud)" stroke="#d4bc9f" stroke-width="1.5" />

    <!-- Pure White Shield Body -->
    <path d="M160,24 C202,24 240,35 263,49 C268,128 257,218 160,314 C63,218 52,128 57,49 C80,35 118,24 160,24 Z"
          fill="url(#shieldBg_badge_fundamentos_cloud)" stroke="#b5885c" stroke-width="1.8" />

    <!-- Thin Interior Border Line -->
    <path d="M160,30 C198,30 234,40 256,53 C260,124 250,210 160,302 C70,210 60,124 64,53 C86,40 122,30 160,30 Z"
          fill="none" stroke="rgba(181, 136, 92, 0.25)" stroke-width="1" />
  </g>

  <!-- IRSI Header Section (Dark Espresso Text on White Shield) -->
  <g transform="translate(160, 72)" text-anchor="middle">
    <!-- IRSI Logo Type -->
    <text y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#231811" letter-spacing="2.5">IRSI</text>
    
    <!-- Warm Divider Line -->
    <line x1="-54" y1="10" x2="54" y2="10" stroke="url(#goldGrad_badge_fundamentos_cloud)" stroke-width="1.8" stroke-linecap="round" />
    
    <text y="22" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#8c5e3c" letter-spacing="1">INFORMATION RISK &amp; SECURITY INSTITUTE</text>
    <text y="36" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="7.5" font-style="italic" fill="#8c7c6e">Insignia emitida por la aprobación del curso</text>
  </g>

  <!-- 3D Ribbon Banner for Course Title -->
  <g transform="translate(0, 134)">
    <!-- Ribbon Left Wing Shadow and Fold -->
    <polygon points="22,38 46,12 46,46" fill="#4d321d" opacity="0.6" />
    <polygon points="14,18 46,12 46,46 14,42" fill="#7c5332" filter="brightness(0.85)" />
    <polyline points="14,18 46,12 46,46 14,42" fill="none" stroke="#d4bc9f" stroke-width="1" />

    <!-- Ribbon Right Wing Shadow and Fold -->
    <polygon points="298,38 274,12 274,46" fill="#4d321d" opacity="0.6" />
    <polygon points="306,18 274,12 274,46 306,42" fill="#7c5332" filter="brightness(0.85)" />
    <polyline points="306,18 274,12 274,46 306,42" fill="none" stroke="#d4bc9f" stroke-width="1" />

    <!-- Ribbon Center Front Plaque -->
    <path d="M36,10 L284,10 C289,10 292,12 290,18 L282,46 C280,50 276,52 271,52 L49,52 C44,52 40,50 38,46 L30,18 C28,12 31,10 36,10 Z"
          fill="url(#ribbonGrad_badge_fundamentos_cloud)" stroke="#d4bc9f" stroke-width="1.8" />

    <!-- Top Highlight Sheen -->
    <line x1="42" y1="13" x2="278" y2="13" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-linecap="round" />

    <!-- Title Text (Crisp White on Coffee Ribbon) -->
    <text x="160" y="37" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.2">Fundamentos de Cloud</text>
  </g>

  <!-- Lower Section (Official Certified Seal & Date on Pure White Shield) -->
  <g transform="translate(160, 206)" text-anchor="middle">
    <!-- Date of Completion -->
    <text y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#8c7c6e" letter-spacing="1">FECHA DE EMISIÓN</text>
    <text y="14" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#231811">03/08/2026</text>

    <!-- Official Medallion Seal -->
    <g transform="translate(0, 44)">
      <!-- Outer Seal Ring -->
      <circle cx="0" cy="0" r="23" fill="#fcf8f3" stroke="#b5885c" stroke-width="2" />
      <!-- Dotted Security Circle -->
      <circle cx="0" cy="0" r="19" fill="none" stroke="#caa57d" stroke-width="0.8" stroke-dasharray="2.5,2" />
      <!-- Inner Solid Core -->
      <circle cx="0" cy="0" r="16" fill="#f7efe4" />
      
      <!-- Specialized Center Vector Icon -->
      
          <path d="M-6,3 C-8,3 -9,1 -9,-1 C-9,-3 -7,-4 -5,-4 C-4,-7 -1,-8 2,-7 C4,-6 5,-4 5,-2 C7,-2 9,-1 9,1 C9,3 7,3 5,3 Z" fill="#ffffff" stroke="#8c5e3c" stroke-width="1.8" stroke-linejoin="round"/>
          <polyline points="-2,-1 0,-3 2,-1" fill="none" stroke="#b5885c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="0" y1="-3" x2="0" y2="1" stroke="#b5885c" stroke-width="1.5" stroke-linecap="round"/>
        
    </g>

    <!-- Accreditation Label -->
    <text y="82" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#8c5e3c" letter-spacing="1.2">&#9733; ACREDITACIÓN IRSI &#9733;</text>
  </g>

  <!-- Bottom Verification Footer Band (Clickable Callout) -->
  <g transform="translate(160, 348)">
    <rect x="-115" y="-10" width="230" height="20" rx="10" fill="#fbf7f2" stroke="#b5885c" stroke-width="1.2" />
    <text text-anchor="middle" y="4" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#6b4322" letter-spacing="0.6">VERIFICAR EN POK &#8599;</text>
  </g>
</svg>