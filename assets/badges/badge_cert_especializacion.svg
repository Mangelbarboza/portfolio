<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 375" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Outer Gradient -->
    <linearGradient id="goldGrad_badge_cert_especializacion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5cc" />
      <stop offset="25%" stop-color="#e5b33d" />
      <stop offset="50%" stop-color="#a6771a" />
      <stop offset="75%" stop-color="#ffd875" />
      <stop offset="100%" stop-color="#ba8722" />
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <radialGradient id="shieldBg_badge_cert_especializacion" cx="50%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#0f2b4e" />
      <stop offset="55%" stop-color="#091b33" />
      <stop offset="100%" stop-color="#040d1a" />
    </radialGradient>

    <!-- Ribbon Gradient -->
    <linearGradient id="ribbonGrad_badge_cert_especializacion" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Crisp Drop Shadow -->
    <filter id="shadow_badge_cert_especializacion" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Shield Frame with Gold Border -->
  <g filter="url(#shadow_badge_cert_especializacion)">
    <!-- Gold Trim -->
    <path d="M160,16 C206,16 246,28 272,44 C277,130 266,226 160,326 C54,226 43,130 48,44 C74,28 114,16 160,16 Z"
          fill="url(#goldGrad_badge_cert_especializacion)" stroke="#ffd875" stroke-width="1.5" />

    <!-- Inner Deep Navy Shield -->
    <path d="M160,24 C202,24 240,35 263,49 C268,128 257,218 160,314 C63,218 52,128 57,49 C80,35 118,24 160,24 Z"
          fill="url(#shieldBg_badge_cert_especializacion)" stroke="#a07820" stroke-width="2" />

    <!-- Thin Glass Highlight Line -->
    <path d="M160,30 C198,30 234,40 256,53 C260,124 250,210 160,302 C70,210 60,124 64,53 C86,40 122,30 160,30 Z"
          fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1" />
  </g>

  <!-- IRSI Header Section -->
  <g transform="translate(160, 74)" text-anchor="middle">
    <!-- IRSI Logo Type -->
    <text y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="2.5">IRSI</text>
    
    <!-- Gold Underline Divider -->
    <line x1="-54" y1="10" x2="54" y2="10" stroke="url(#goldGrad_badge_cert_especializacion)" stroke-width="1.5" stroke-linecap="round" />
    
    <text y="22" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#ffd875" letter-spacing="1">INFORMATION RISK &amp; SECURITY INSTITUTE</text>
    <text y="36" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="7.5" font-style="italic" fill="#94a3b8">Insignia emitida por la aprobación del curso</text>
  </g>

  <!-- 3D Ribbon Banner for Course Title -->
  <g transform="translate(0, 136)">
    <!-- Ribbon Left Wing Shadow and Fold -->
    <polygon points="22,38 46,12 46,46" fill="#040d1a" opacity="0.8" />
    <polygon points="14,18 46,12 46,46 14,42" fill="#b45309" filter="brightness(0.65)" />
    <polyline points="14,18 46,12 46,46 14,42" fill="none" stroke="url(#goldGrad_badge_cert_especializacion)" stroke-width="1" />

    <!-- Ribbon Right Wing Shadow and Fold -->
    <polygon points="298,38 274,12 274,46" fill="#040d1a" opacity="0.8" />
    <polygon points="306,18 274,12 274,46 306,42" fill="#b45309" filter="brightness(0.65)" />
    <polyline points="306,18 274,12 274,46 306,42" fill="none" stroke="url(#goldGrad_badge_cert_especializacion)" stroke-width="1" />

    <!-- Ribbon Center Front Plaque -->
    <path d="M36,10 L284,10 C289,10 292,12 290,18 L282,46 C280,50 276,52 271,52 L49,52 C44,52 40,50 38,46 L30,18 C28,12 31,10 36,10 Z"
          fill="url(#ribbonGrad_badge_cert_especializacion)" stroke="url(#goldGrad_badge_cert_especializacion)" stroke-width="1.8" />

    <!-- Top Highlight Sheen -->
    <line x1="42" y1="13" x2="278" y2="13" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-linecap="round" />

    <!-- Title Text -->
    <text x="160" y="37" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="0.2">Especialización CERT</text>
  </g>

  <!-- Lower Section (Date & QR Verification) -->
  <g transform="translate(160, 228)" text-anchor="middle">
    <text y="-10" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="500" fill="#94a3b8">Realizado en</text>
    <text y="4" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#ffffff">Culminación: 2026</text>

    <!-- Vector QR Code representation -->
    <g transform="translate(-18, 14)">
      <rect width="36" height="36" rx="4" fill="#ffffff" stroke="url(#goldGrad_badge_cert_especializacion)" stroke-width="1.5" />
      <!-- Stylized QR blocks -->
      <rect x="4" y="4" width="10" height="10" fill="#091b33" />
      <rect x="6" y="6" width="6" height="6" fill="#ffffff" />
      <rect x="8" y="8" width="2" height="2" fill="#091b33" />
      <rect x="22" y="4" width="10" height="10" fill="#091b33" />
      <rect x="24" y="6" width="6" height="6" fill="#ffffff" />
      <rect x="26" y="8" width="2" height="2" fill="#091b33" />
      <rect x="4" y="22" width="10" height="10" fill="#091b33" />
      <rect x="6" y="24" width="6" height="6" fill="#ffffff" />
      <rect x="8" y="26" width="2" height="2" fill="#091b33" />
      <!-- Data dots -->
      <rect x="17" y="6" width="2" height="4" fill="#091b33" />
      <rect x="17" y="16" width="4" height="4" fill="#091b33" />
      <rect x="22" y="18" width="4" height="2" fill="#091b33" />
      <rect x="17" y="24" width="4" height="4" fill="#091b33" />
      <rect x="24" y="24" width="6" height="4" fill="#091b33" />
    </g>
  </g>

  <!-- Bottom Verification Footer Band -->
  <g transform="translate(160, 350)">
    <rect x="-115" y="-7" width="230" height="16" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
    <text text-anchor="middle" y="5" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#fef3c7" letter-spacing="0.4">Especialización CERT &bull; Recta Final</text>
  </g>
</svg>