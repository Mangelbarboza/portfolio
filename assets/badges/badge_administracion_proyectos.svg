<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 375" width="320" height="375">
  <defs>
    <!-- Metallic Brass & Gold Gradient -->
    <linearGradient id="goldGrad_badge_administracion_proyectos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcf9f2" />
      <stop offset="25%" stop-color="#caa57d" />
      <stop offset="50%" stop-color="#8a6642" />
      <stop offset="75%" stop-color="#e2cca7" />
      <stop offset="100%" stop-color="#6e4b29" />
    </linearGradient>

    <!-- Deep Coffee Shield Gradient -->
    <radialGradient id="shieldBg_badge_administracion_proyectos" cx="50%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#2c2017" />
      <stop offset="55%" stop-color="#1d140e" />
      <stop offset="100%" stop-color="#100a07" />
    </radialGradient>

    <!-- Warm Coffee Ribbon Gradient -->
    <linearGradient id="ribbonGrad_badge_administracion_proyectos" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#754f2f" />
      <stop offset="50%" stop-color="#a3764c" />
      <stop offset="100%" stop-color="#754f2f" />
    </linearGradient>

    <!-- Subtle Warm Shadow -->
    <filter id="shadow_badge_administracion_proyectos" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1f140e" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Shield Frame with Metallic Border -->
  <g filter="url(#shadow_badge_administracion_proyectos)">
    <!-- Trim -->
    <path d="M160,16 C206,16 246,28 272,44 C277,130 266,226 160,326 C54,226 43,130 48,44 C74,28 114,16 160,16 Z"
          fill="url(#goldGrad_badge_administracion_proyectos)" stroke="#e2cca7" stroke-width="1.5" />

    <!-- Inner Coffee Shield -->
    <path d="M160,24 C202,24 240,35 263,49 C268,128 257,218 160,314 C63,218 52,128 57,49 C80,35 118,24 160,24 Z"
          fill="url(#shieldBg_badge_administracion_proyectos)" stroke="#8a6642" stroke-width="2" />

    <!-- Thin Highlight Line -->
    <path d="M160,30 C198,30 234,40 256,53 C260,124 250,210 160,302 C70,210 60,124 64,53 C86,40 122,30 160,30 Z"
          fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" />
  </g>

  <!-- IRSI Header Section -->
  <g transform="translate(160, 72)" text-anchor="middle">
    <!-- IRSI Logo Type -->
    <text y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="2.5">IRSI</text>
    
    <!-- Gold Underline Divider -->
    <line x1="-54" y1="10" x2="54" y2="10" stroke="url(#goldGrad_badge_administracion_proyectos)" stroke-width="1.5" stroke-linecap="round" />
    
    <text y="22" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#edd0ac" letter-spacing="1">INFORMATION RISK &amp; SECURITY INSTITUTE</text>
    <text y="36" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="7.5" font-style="italic" fill="#c4b5a5">Insignia emitida por la aprobación del curso</text>
  </g>

  <!-- 3D Ribbon Banner for Course Title -->
  <g transform="translate(0, 134)">
    <!-- Ribbon Left Wing Shadow and Fold -->
    <polygon points="22,38 46,12 46,46" fill="#100a07" opacity="0.8" />
    <polygon points="14,18 46,12 46,46 14,42" fill="#754f2f" filter="brightness(0.7)" />
    <polyline points="14,18 46,12 46,46 14,42" fill="none" stroke="url(#goldGrad_badge_administracion_proyectos)" stroke-width="1" />

    <!-- Ribbon Right Wing Shadow and Fold -->
    <polygon points="298,38 274,12 274,46" fill="#100a07" opacity="0.8" />
    <polygon points="306,18 274,12 274,46 306,42" fill="#754f2f" filter="brightness(0.7)" />
    <polyline points="306,18 274,12 274,46 306,42" fill="none" stroke="url(#goldGrad_badge_administracion_proyectos)" stroke-width="1" />

    <!-- Ribbon Center Front Plaque -->
    <path d="M36,10 L284,10 C289,10 292,12 290,18 L282,46 C280,50 276,52 271,52 L49,52 C44,52 40,50 38,46 L30,18 C28,12 31,10 36,10 Z"
          fill="url(#ribbonGrad_badge_administracion_proyectos)" stroke="url(#goldGrad_badge_administracion_proyectos)" stroke-width="1.8" />

    <!-- Top Highlight Sheen -->
    <line x1="42" y1="13" x2="278" y2="13" stroke="rgba(255,255,255,0.45)" stroke-width="1.2" stroke-linecap="round" />

    <!-- Title Text -->
    <text x="160" y="37" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.2">Administración de Proyectos</text>
  </g>

  <!-- Lower Section (Official Certified Seal & Date - Clean without QR) -->
  <g transform="translate(160, 206)" text-anchor="middle">
    <!-- Date of Completion -->
    <text y="0" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8" font-weight="600" fill="#c4b5a5" letter-spacing="1">FECHA DE EMISIÓN</text>
    <text y="14" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#ffffff">14/08/2026</text>

    <!-- Official Medallion Seal -->
    <g transform="translate(0, 44)">
      <!-- Outer Seal Ring -->
      <circle cx="0" cy="0" r="23" fill="#100a07" stroke="url(#goldGrad_badge_administracion_proyectos)" stroke-width="2" />
      <!-- Dotted Security Circle -->
      <circle cx="0" cy="0" r="19" fill="none" stroke="#e2cca7" stroke-width="0.75" stroke-dasharray="2.5,2" opacity="0.8" />
      <!-- Inner Solid Core -->
      <circle cx="0" cy="0" r="16" fill="#1d140e" />
      
      <!-- Specialized Center Vector Icon -->
      
          <rect x="-7" y="-8" width="14" height="16" rx="2" fill="none" stroke="#d4af83" stroke-width="1.8"/>
          <line x1="-3" y1="-3" x2="3" y2="-3" stroke="#fcf9f2" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="-3" y1="1" x2="3" y2="1" stroke="#fcf9f2" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="-3" y1="5" x2="0" y2="5" stroke="#fcf9f2" stroke-width="1.5" stroke-linecap="round"/>
        
    </g>

    <!-- Accreditation Label -->
    <text y="82" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8" font-weight="800" fill="#edd0ac" letter-spacing="1.2">&#9733; ACREDITACIÓN IRSI &#9733;</text>
  </g>

  <!-- Bottom Verification Footer Band (Clickable Callout) -->
  <g transform="translate(160, 348)">
    <rect x="-115" y="-10" width="230" height="20" rx="10" fill="#1f150f" stroke="#a3764c" stroke-width="1.2" />
    <text text-anchor="middle" y="4" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#f3e5d5" letter-spacing="0.6">VERIFICAR EN POK &#8599;</text>
  </g>
</svg>